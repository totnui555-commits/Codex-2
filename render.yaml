# Management-only staging. Not the production/24x7 worker topology.
# Uses the existing free DB created in the founder-confirmed workspace.
# That DB expires after 30 days; do not store production/customer data here.
services:
  - type: web
    name: company-os-staging
    runtime: docker
    region: singapore
    plan: free
    repo: https://github.com/totnui555-commits/Codex-2
    branch: codex/company-os-implementation
    dockerfilePath: infrastructure/staging.Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: company-os-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: RUNTIME
        value: staging
      - key: SECURE_COOKIES
        value: 'true'
      - key: PORT
        value: '10000'
      - key: MODEL_PROVIDER
        value: openrouter
      - key: CODEX_PROVIDER
        value: openrouter

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-company-os"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.38,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.10,<3", "httpx>=0.28,<1", "temporalio>=1.10,<2", "openai-agents>=0.4,<1", "daytona>=0.100,<1", "boto3>=1.37,<2", "cryptography>=44,<50", "opentelemetry-instrumentation-fastapi>=0.52b0,<1", "prometheus-client>=0.21,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "playwright>=1.51,<2"]
[tool.setuptools.packages.find]
where = ["apps/api"]
[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"apps/api/tests/conftest.py" = ["F403", "F405", "E402"]
